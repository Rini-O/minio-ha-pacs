# volumes:
#   vol-single:
services:
  minio1:
    image: elestio/minio:latest
    container_name: minio1
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: AdminMinio12345!
    command: server /data --address ':9000' --console-address ':9001'
    volumes:
      - minio1_data:/data

  minio2:
    image: elestio/minio:latest
    container_name: minio2
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: AdminMinio12345!
    command: server /data --address ':9000' --console-address ':9001'
    volumes:
      - minio2_data:/data

  minio3:
    image: elestio/minio:latest
    container_name: minio3
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: AdminMinio12345!
    command: server /data --address ':9000' --console-address ':9001'
    volumes:
      - minio3_data:/data

  minio4:
    image: elestio/minio:latest
    container_name: minio4
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: AdminMinio12345!
    command: server /data --address ':9000' --console-address ':9001'
    volumes:
      - minio4_data:/data

  nginx1:
    image: nginx:1.27-alpine
    container_name: nginx1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4

  nginx2:
    image: nginx:1.27-alpine
    container_name: nginx2
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4

volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:
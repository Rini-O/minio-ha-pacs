events { worker_connections 4096; }
 
http {
  access_log off;   # dimatikan agar tidak membebani CPU saat load test
 
  upstream minio_s3 {
    least_conn;
    server minio1:9000 max_fails=2 fail_timeout=10s;
    server minio2:9000 max_fails=2 fail_timeout=10s;
    server minio3:9000 max_fails=2 fail_timeout=10s;
    server minio4:9000 max_fails=2 fail_timeout=10s;
  }
 
  upstream minio_console {
    ip_hash;
    server minio1:9001;
    server minio2:9001;
    server minio3:9001;
    server minio4:9001;
  }
 
  server {
    listen 9000;
    client_max_body_size 0;
    proxy_request_buffering off;
 
    location / {
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;   # failover cepat saat node mati
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://minio_s3;
    }
  }
 
  server {
    listen 9001;
 
    location / {
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://minio_console;
    }
  }
}

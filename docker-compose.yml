# ============================================================
# MinIO Distributed Cluster (4 node) + Nginx Load Balancer
# Studi kasus: PACS Storage - Tugas Besar Cloud Computing
# Jalankan : docker compose up -d
# ============================================================
name: minio-ha-pacs
 
x-minio-common: &minio-common
  image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
  command: server http://minio{1...4}/data --console-address ":9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pacsadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pacs-secret-123}
  networks: [storage-net]
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 256M
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 15s
    timeout: 5s
    retries: 3
  restart: unless-stopped
 
services:
  minio1:
    <<: *minio-common
    container_name: minio1
    hostname: minio1
    volumes: [vol-minio1:/data]
 
  minio2:
    <<: *minio-common
    container_name: minio2
    hostname: minio2
    volumes: [vol-minio2:/data]
 
  minio3:
    <<: *minio-common
    container_name: minio3
    hostname: minio3
    volumes: [vol-minio3:/data]
 
  minio4:
    <<: *minio-common
    container_name: minio4
    hostname: minio4
    volumes: [vol-minio4:/data]
 
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [minio1, minio2, minio3, minio4]
    networks: [frontend-net, storage-net]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
 
networks:
  frontend-net:
    driver: bridge
  storage-net:
    driver: bridge
    internal: true
 
volumes:
  vol-minio1:
  vol-minio2:
  vol-minio3:
  vol-minio4:
